name: ig-publish

# 2026-09-17 変更：毎日4便 → 週1便（毎週火曜）。実名IGの動画投稿を週1本に落とした。
#   「週に最大1本」は cron(週1) と IG_MAX_PER_RUN=1 の二重で担保している。片方だけでは足りない。
on:
  schedule:
    # 旧：4便（"5 10" / "25 10" / "45 10" / "5 11"）。19:00設計だが実測がドリフトするため
    #   「4回引けばどれかが19〜20時台に着地する」設計だった。週1便にしたのでこの前提は失効。
    #   実測のドリフトは3〜4時間あるので、着地は JST 21〜24時台になる見込み。
    #   ig_publish.py は status=="pending" のものだけを投稿して posted に書き戻すので冪等。
    - cron: "5 10 * * 2"   # 毎週火曜 19:05 JST 予定（= 10:05 UTC）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると投稿せず対象だけ表示（テスト）"
        required: false
        default: "0"

permissions:
  contents: write   # 投稿後に approved_reels_ig.json / logs をコミットするため

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          IG_MAX_PER_RUN: "1"   # 2026-09-17 追加。1回のrunで最大1本（ig_publish.py の既定は2）
          TZ: Asia/Tokyo
        run: python ig_publish.py

      - name: Commit status updates
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "ig-publisher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/approved_reels_ig.json logs/posted_log.json || true
          git commit -m "chore: ig-publish run $(date -u +%FT%TZ)" || echo "no changes"
          git push || echo "push skipped"
