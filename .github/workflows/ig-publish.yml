name: ig-publish

# 毎日 19:00 JST (= 10:00 UTC) に実行。手動実行(workflow_dispatch)も可（DRY_RUNで安全確認）。
on:
  schedule:
    # 2026-09-08 増便。設計は19:00だが実測の投稿時刻が 22時→23時→0時→2時 とドリフトし、
    #   09-08 は 00:24/00:25 に2本（前日分の持ち越し）、09-07 は0本になっていた。
    #   ig_publish.py は status=="pending" のものだけを投稿して posted に書き戻すので冪等。
    #   同じ日に複数便が走っても二重投稿にならない（健診 check_ig_double_post が見ているのは
    #   「前日分の持ち越しで同日2本」の方で、これは便を増やすほど減る）。
    #   各便の遅延は独立に引かれるので、4回引けばどれかが19〜20時台に着地する確率が上がる。
    #   :00 を外したのは毎時0分の混雑を避けるため。
    - cron: "5 10 * * *"
    - cron: "25 10 * * *"
    - cron: "45 10 * * *"
    - cron: "5 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると投稿せず対象だけ表示（テスト）"
        required: false
        default: "0"

permissions:
  contents: write   # 投稿後に approved_reels_ig.json / logs をコミットするため

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TZ: Asia/Tokyo
        run: python ig_publish.py

      - name: Commit status updates
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "ig-publisher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/approved_reels_ig.json logs/posted_log.json || true
          git commit -m "chore: ig-publish run $(date -u +%FT%TZ)" || echo "no changes"
          git push || echo "push skipped"
